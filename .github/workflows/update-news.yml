name: update news feed

on:
  schedule:
    - cron: '15 6,18 * * *'   # 09:15 and 21:15 UTC, twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: fetch HN AI stories and commit news.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: fetch news
        run: python3 fetch_news.py

      - name: commit if changed
        run: |
          if [ -z "$(git status --porcelain news.json)" ]; then
            echo "news.json unchanged"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "chore(news): refresh news.json ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
